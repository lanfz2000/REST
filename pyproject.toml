[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-pathology"
version = "0.1.0"
description = "Reliability-guided spatial transcriptomics supervision for pathology foundation models"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scipy>=1.10",
  "timm>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
